<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050608">
<title>Statistiky — Vesmírná laboratoř</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--signal:#f5a623;--franta:#f2c40f;--pepa:#ff6b6b;--bg:#050608;
    --text:#cfd3d8;--muted:#8b929c;--line:#2a2f36;--card:#0d1016;--ok:#39d98a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'IBM Plex Mono',Consolas,monospace;background:var(--bg);
    color:var(--text);line-height:1.5;padding:20px 16px 60px}
  .wrap{max-width:920px;margin:0 auto}
  h1{font-size:20px;color:#fff;letter-spacing:.04em}
  h1 small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:4px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 22px}
  button{font-family:inherit;cursor:pointer;background:var(--card);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px}
  button:hover{border-color:var(--signal);color:#fff}
  .upd{color:var(--muted);font-size:11px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h2{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;margin-bottom:10px}
  .big{font-size:34px;color:#fff;font-weight:700;line-height:1}
  .big span{font-size:14px;color:var(--muted);font-weight:400}
  .sub{color:var(--muted);font-size:12px;margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
  td{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  td:last-child{text-align:right;color:#fff;font-weight:700}
  .full{grid-column:1/-1}
  .rate{height:8px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;margin-top:8px}
  .rate>i{display:block;height:100%;background:var(--ok)}
  /* KPI přehled */
  .kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .kpi-n{font-size:27px;color:#fff;font-weight:700;line-height:1.1}
  .kpi-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
  .kpi-s{font-size:11px;color:var(--muted);opacity:.75;margin-top:3px}
  /* grafy */
  .legend{font-size:11px;color:var(--muted);margin-bottom:10px}
  .chartwrap{overflow-x:auto;padding-bottom:4px}
  .chart{display:block;width:100%;height:auto}
  .chrow{display:flex;align-items:center;gap:10px;padding:5px 0}
  .chname{width:130px;flex:0 0 auto;font-size:12px;color:#fff}
  .chrow.win .chname{color:var(--ok);font-weight:700}
  .chbar{flex:1;height:12px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden}
  .chbar>i{display:block;height:100%;background:var(--signal)}
  .chrow.win .chbar>i{background:var(--ok)}
  .chval{width:74px;flex:0 0 auto;text-align:right;font-size:12px;color:#fff;font-weight:700}
  .chval em{color:var(--muted);font-weight:400;font-style:normal;font-size:11px}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px;text-align:center;color:var(--muted);font-size:13px}
  .msg.err{border-color:var(--pepa);color:var(--pepa)}
  input{font-family:inherit;background:#05070c;border:1px solid var(--line);color:#fff;
    border-radius:8px;padding:9px 11px;font-size:13px;width:260px;max-width:70vw}
  a.back{color:var(--signal);text-decoration:none;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/vesmirna-laborator/">← zpět na laboratoř</a>
  <h1 style="margin-top:10px">Statistiky Vesmírné laboratoře
    <small>anonymní data • aktualizace: <span id="upd">—</span></small></h1>

  <div class="bar">
    <button id="refresh">↻ Načíst znovu</button>
    <button id="logout" style="display:none">Odhlásit klíč</button>
    <span class="upd" id="range"></span>
  </div>

  <div id="stage"><div class="msg">Načítám…</div></div>
</div>

<script>
/* Adresa se vyplní po nasazení Apps Scriptu (stejná jako v analytics.js). */
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbxUdeu73DlPTQWuEtMtvmBIV7yI_dudoaoKM0zWVcu3Fsy348YeQ3U1rtPQLb9UXMN13g/exec';

var KAN = {copy:'Odkaz (kopie)', fb:'Facebook', threads:'Threads',
           wa:'WhatsApp', ig:'Instagram', vice:'Systémové (další)', '?':'Neznámý'};
var POLIT = {babis:'Babiš', pekarova:'Pekarová', pavel:'Pavel',
             schillerova:'Schillerová', okamura:'Okamura', konecna:'Konečná',
             rakusan:'Rakušan', turek:'Turek', '?':'Neznámý'};

var stage = document.getElementById('stage');
var elUpd = document.getElementById('upd');

function needsKey(){
  if(!ENDPOINT || ENDPOINT.indexOf('PASTE') === 0){
    stage.innerHTML = '<div class="msg err">Dashboard ještě nemá adresu Apps Scriptu. '
      + 'Až bude web nasazený s měřením, tohle zmizí.</div>';
    return true;
  }
  return false;
}

function getKey(){ try{ return localStorage.getItem('lab_key')||''; }catch(e){ return ''; } }
function askKey(msg){
  document.getElementById('logout').style.display='none';
  stage.innerHTML = '<div class="msg'+(msg?' err':'')+'">'+(msg||'Zadej přístupový klíč ke statistikám:')
    + '<div style="margin-top:12px"><input id="k" type="password" placeholder="klíč"> '
    + '<button id="ok">Zobrazit</button></div></div>';
  document.getElementById('ok').onclick = function(){
    var v = document.getElementById('k').value.trim();
    if(v){ try{ localStorage.setItem('lab_key', v); }catch(e){} load(); }
  };
  document.getElementById('k').addEventListener('keydown', function(e){
    if(e.key==='Enter') document.getElementById('ok').click();
  });
}

function load(){
  if(needsKey()) return;
  var key = getKey();
  if(!key){ askKey(); return; }
  stage.innerHTML = '<div class="msg">Načítám…</div>';
  var cbName = '__labcb';
  window[cbName] = function(d){
    cleanup();
    if(d && d.error){ askKey('Špatný klíč. Zkus to znovu:'); return; }
    render(d);
  };
  var s = document.createElement('script');
  s.id = '__labscript';
  s.onerror = function(){ cleanup(); stage.innerHTML =
    '<div class="msg err">Nepodařilo se spojit s Apps Scriptem. Zkontroluj nasazení a adresu.</div>'; };
  s.src = ENDPOINT + '?key=' + encodeURIComponent(key) + '&callback=' + cbName + '&_=' + Date.now();
  document.body.appendChild(s);
}
function cleanup(){
  var s = document.getElementById('__labscript'); if(s) s.remove();
}

function fmtTime(sec){
  if(!sec) return '0 s';
  var m = Math.floor(sec/60), s = sec%60;
  return m ? (m+' min '+s+' s') : (s+' s');
}
function rows(obj, mapNames){
  var keys = Object.keys(obj||{}).sort(function(a,b){ return obj[b]-obj[a]; });
  if(!keys.length) return '<tr><td colspan="2" style="color:#8b929c">zatím nic</td></tr>';
  return keys.map(function(k){
    var name = mapNames ? (mapNames[k]||k) : k;
    return '<tr><td>'+name+'</td><td>'+obj[k]+'</td></tr>';
  }).join('');
}
// Google Sheet občas přetypuje textové datum na Date → klíč přijde jako
// "Sat Jul 25 2026 …". Sjednotíme na 2026-07-25 (a sloučíme případné duplicity).
var MON = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',
           Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
function normDay(k){
  k = String(k);
  if(/^\d{4}-\d{2}-\d{2}/.test(k)) return k.slice(0,10);
  var p = k.split(' ');                 // ["Sat","Jul","25","2026",…]
  if(p.length >= 4 && MON[p[1]]) return p[3]+'-'+MON[p[1]]+'-'+('0'+p[2]).slice(-2);
  return k;
}
function normByDay(obj){
  var out = {};
  for(var k in (obj||{})){ var d = normDay(k); out[d] = (out[d]||0) + obj[k]; }
  return out;
}
function byDayRows(obj){
  obj = normByDay(obj);
  var keys = Object.keys(obj).sort().reverse();
  if(!keys.length) return '<tr><td colspan="2" style="color:#8b929c">zatím nic</td></tr>';
  return keys.map(function(k){ return '<tr><td>'+k+'</td><td>'+obj[k]+'</td></tr>'; }).join('');
}

// když skript ještě vrací starou strukturu (bez d.days), poskládáme aspoň
// návštěvy a otevření po dnech; sdílení po dnech pak bude 0 do přenasazení skriptu
function mergeDaysFallback(lv, b){
  var out = {}, lvd = normByDay(lv.byDay), opd = normByDay(b.opensByDay);
  function cell(k){ return out[k] || (out[k] = {lab:0, opens:0, shares:0, clicks:0}); }
  Object.keys(lvd).forEach(function(k){ cell(k).lab = lvd[k]; });
  Object.keys(opd).forEach(function(k){ cell(k).opens = opd[k]; });
  return out;
}

// souvislá řada dnů: od včerejška (nebo nejstaršího dne s daty) do dneška,
// chybějící dny doplní nulami → graf roste z nuly
function ymd(dt){ return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2); }
function fillDays(days){
  days = days || {};
  var today = new Date(); today.setHours(12,0,0,0);
  var start = new Date(today); start.setDate(start.getDate()-1);   // startovací den = včera
  Object.keys(days).forEach(function(k){
    var d = new Date(k+'T12:00:00'); if(d < start) start = d;      // starší data → posuň start
  });
  var out = {}, cur = new Date(start);
  while(cur <= today){
    var key = ymd(cur);
    out[key] = days[key] || {lab:0, opens:0, shares:0, clicks:0};
    cur.setDate(cur.getDate()+1);
  }
  return out;
}

// spojnicový graf jedné statistiky po dnech (svislá osa = počet, vodorovná = dny)
// Fixní viewBox roztažený přes celou šířku karty → body jdou přes celou šířku,
// čára jasně stoupá zleva (včera) doprava (dnes).
function lineChart(days, key, color){
  var keys = Object.keys(days||{}).sort().slice(-30);
  if(!keys.length) return '<div class="sub">zatím žádná data</div>';
  var vals = keys.map(function(d){ return days[d][key]||0; });
  var max = Math.max.apply(null, vals.concat([1]));
  var VBW=640, H=180, padL=40, padR=24, padT=22, padB=26;
  var plotW = VBW - padL - padR, plotH = H - padT - padB;
  var n = keys.length;
  function X(i){ return n>1 ? padL + plotW * (i/(n-1)) : padL + plotW/2; }
  function Y(v){ return padT + plotH*(1 - v/max); }

  // osy: základní čára (0), přerušovaná na maximu, popisky počtu
  var g = '';
  g += '<line x1="'+padL+'" y1="'+Y(0)+'" x2="'+(VBW-padR)+'" y2="'+Y(0)+'" stroke="#2a2f36"/>';
  g += '<line x1="'+padL+'" y1="'+Y(max)+'" x2="'+(VBW-padR)+'" y2="'+Y(max)+'" stroke="#1c2129" stroke-dasharray="4 4"/>';
  g += '<text x="'+(padL-8)+'" y="'+(Y(max)+4)+'" text-anchor="end" font-size="11" fill="#8b929c">'+max+'</text>';
  g += '<text x="'+(padL-8)+'" y="'+(Y(0)+4)+'" text-anchor="end" font-size="11" fill="#8b929c">0</text>';

  var pts = vals.map(function(v,i){ return X(i).toFixed(1)+','+Y(v).toFixed(1); }).join(' ');
  var area = n>1
    ? '<polygon points="'+X(0).toFixed(1)+','+Y(0)+' '+pts+' '+X(n-1).toFixed(1)+','+Y(0)
      +'" fill="'+color+'" opacity="0.10"/>' : '';
  var line = n>1
    ? '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
    : '';
  var dots='', xl='';
  keys.forEach(function(d,i){
    var v = vals[i];
    dots += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="4" fill="'+color+'"><title>'+d+': '+v+'</title></circle>';
    dots += '<text x="'+X(i).toFixed(1)+'" y="'+(Y(v)-9)+'" text-anchor="middle" font-size="11" fill="#e8eaed" font-weight="700">'+v+'</text>';
    xl   += '<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#8b929c">'
          + d.slice(8,10)+'.'+d.slice(5,7)+'.</text>';
  });
  return '<svg viewBox="0 0 '+VBW+' '+H+'" preserveAspectRatio="xMidYMid meet" class="chart">'
    + g + area + line + dots + xl + '</svg>';
}

// žebříček (nejvíc nahoře, vítěz zvýrazněn) — pro kanály i politiky
function rankChart(obj, total, names, prazdno){
  var keys = Object.keys(obj||{}).sort(function(a,b){ return obj[b]-obj[a]; });
  if(!keys.length) return '<div class="sub">'+(prazdno||'zatím nic')+'</div>';
  var max = obj[keys[0]] || 1;
  return keys.map(function(k,i){
    var v=obj[k], pct=total?Math.round(v/total*100):0, w=Math.round(v/max*100);
    return '<div class="chrow'+(i===0?' win':'')+'">'
      + '<span class="chname">'+((names&&names[k])||k)+'</span>'
      + '<span class="chbar"><i style="width:'+w+'%"></i></span>'
      + '<span class="chval">'+v+' <em>'+pct+'%</em></span></div>';
  }).join('');
}

function kpi(val, label, sub){
  return '<div class="kpi"><div class="kpi-n">'+val+'</div>'
       + '<div class="kpi-l">'+label+'</div>'
       + '<div class="kpi-s">'+(sub||'')+'</div></div>';
}

function topKey(obj, names){
  var keys = Object.keys(obj||{});
  if(!keys.length) return '—';
  keys.sort(function(a,b){ return obj[b]-obj[a]; });
  return ((names&&names[keys[0]])||keys[0]) + ' (' + obj[keys[0]] + ')';
}

function render(d){
  document.getElementById('logout').style.display='';
  elUpd.textContent = d.updated || '—';
  var b = d.bh || {}, lv = d.labViews || {}, ac = d.appClicks || {}, sh = b.shares || {};
  var pol = d.politiks || {total:0, byName:{}};
  var days = fillDays(d.days || mergeDaysFallback(lv, b));

  stage.innerHTML =
    '<div class="kpis">'
    + kpi(lv.total||0, 'návštěvy laboratoře', (lv.unique||0)+' unikátních')
    + kpi(b.opensTotal||0, 'otevření černé díry', (b.opensUnique||0)+' unikátních')
    + kpi(fmtTime(b.avgPlaySec||0), 'prům. čas hraní', 'z '+(b.playSessions||0)+' návštěv')
    + kpi((b.sharePct||0)+' %', 'sdílelo z těch co otevřeli', (b.sharedSessions||0)+' z '+(b.openedSessions||0))
    + kpi(pol.total||0, 'hozených politiků', 'nej: '+topKey(pol.byName, POLIT))
    + '</div>'
    + cardFull('Návštěvy laboratoře po dnech', lineChart(days, 'lab', '#5b9dff'))
    + cardFull('Otevření černé díry po dnech', lineChart(days, 'opens', '#f5a623'))
    + cardFull('Sdílení po dnech', lineChart(days, 'shares', '#39d98a'))
    + cardFull('🔥 Žebříček nenávisti — kolikrát kdo hozen do díry',
        rankChart(pol.byName, pol.total||0, POLIT, 'zatím nikdo nikoho nehodil'))
    + cardFull('Nejsdílenější kanál',
        rankChart(sh.byChannel, sh.total||0, KAN, 'zatím nikdo nesdílel'));
}
function cardFull(t, body){ return '<div class="card full" style="margin-top:14px"><h2>'+t+'</h2>'+body+'</div>'; }

document.getElementById('refresh').onclick = load;
document.getElementById('logout').onclick = function(){
  try{ localStorage.removeItem('lab_key'); }catch(e){}
  askKey();
};
load();
</script>
</body>
</html>
